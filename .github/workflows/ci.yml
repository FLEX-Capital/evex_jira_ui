---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group analysis --group dev

      - name: Check dependency lock and runtime export
        run: |
          uv lock --check
          uv run --frozen --no-sync python tools/dependency_export.py --check

      - name: Check clean runtime
        run: >-
          uv run --frozen --no-sync pytest
          tests/test_dependency_contract.py::test_clean_runtime_imports_supported_entry_points
          --run-runtime-install --no-cov

      - name: Check notebook outputs
        run: uv run --frozen python tools/notebook_outputs.py --check

      - name: Run tests
        run: uv run --frozen --no-sync pytest --cov-report=xml

      - name: Coverage comment
        uses: MishaKav/pytest-coverage-comment@v1.10.0
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          pytest-xml-coverage-path: coverage.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    env:
      TRUNK_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked analysis and development groups
        run: uv sync --frozen --group analysis --group dev

      - name: Native Python quality
        run: uv run --frozen --no-sync python tools/check_python.py --all

      - name: Complete maintained types
        run: uv run --frozen --no-sync mypy

      - name: Trunk check
        uses: trunk-io/trunk-action@v1.3.1
