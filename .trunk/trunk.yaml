---
# This file controls the behavior of Trunk:
# https://docs.trunk.io/cli
# To learn more about the format of this file,
# see https://docs.trunk.io/reference/trunk-yaml

version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here.
# (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters.
# (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    # Trunk plugin v1.11.0 wraps pinact with v4 flags; v5 rejects them.
    - pinact@4.0.0
    - actionlint@1.7.12
    - yamllint@1.38.0
    - bandit@1.9.4
    - checkov@3.3.30
    - dotenv-linter@4.0.0
    - git-diff-check
    - grype@0.121.0
    - hadolint@2.15.1
    - markdownlint@0.49.1
    - osv-scanner@2.7.0
    - oxipng@10.2.1
    - prettier@3.9.10
    - ruff@0.17.1
    - taplo@0.10.0
    - trufflehog@3.99.3
  ignore:
    # Native python-quality checks notebooks without the broken location adapter.
    - linters: [ruff]
      paths: ["**/*.ipynb"]
    # Unsupported historical source; the separate notebook output guard still applies.
    - linters: [ruff]
      paths: [analysis/archive/**]
    - linters:
        - bandit
      paths:
        - tests
actions:
  definitions:
    - id: python-quality
      display_name: Native Python Quality
      description: Check index source/config with locked native Ruff and notebook output policy
      run: .venv/bin/python tools/check_python.py --staged --types --index-file '${env.GIT_INDEX_FILE}'
      triggers:
        - git_hooks: [pre-commit, pre-push]
  disabled:
    - trunk-announce
  enabled:
    - python-quality
    - trunk-check-pre-commit
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
