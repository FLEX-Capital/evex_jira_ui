[project]
name = "streamlit-ui"
version = "0.1.0"
description = "Streamlit analytics dashboard for EVEX Jira service desks"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Flex Capital", email = "engineering@flex.capital" }]
dependencies = [
  "holidays>=0.97",
  "jira>=3.10.5",
  "numpy>=2.4.6",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3,<3",
  "plotly>=6.7.0",
  "pygwalker>=0.5.0.1",
  "requests>=2.34.2",
  # pygwalker 0.5.0.1 (the latest release) imports
  # streamlit.web.server.server_util.make_url_path_regex. That symbol was removed in
  # streamlit 1.57.0 - verified by inspecting the wheels of 1.53.1 through 1.60.0 - so
  # 1.56.x is the last release the Interaktiv tab works on (verified by installing
  # streamlit 1.56.0 + pygwalker 0.5.0.1 and importing pygwalker.api.streamlit).
  # The >=1.54.0 floor is required: it patches SSRF advisory GHSA-7p48-42j8-8846 and
  # cache-collision advisory GHSA-vqwp-45wm-r9r5, both of which affect 1.52.x.
  # Raise the ceiling only once pygwalker stops importing make_url_path_regex.
  "streamlit>=1.54.0,<1.57",
  "streamlit-aggrid>=1.2.1",
]

[dependency-groups]
analysis = [
  "ipykernel==7.3.0",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
  "jupyter>=1.1.1",
  "openai>=2.38.0",
  "pyarrow>=24.0.0",
  "pydantic>=2.13.4",
  "python-pptx>=1.0.2",
  "pytz>=2026.2",
  "tqdm>=4.70.1",
]
dev = [
  "ruff==0.17.1",
  "httpx>=0.28.1",
  "pytest>=8.0",
  "pytest-cov>=5",
  "types-requests>=2.33.0.20261006",
  "types-pyyaml>=6.0.12.20260906",
  "mypy==1.13.0",
  "pandas-stubs>=2.3.3,<3",
  "types-tqdm>=4.70.0.20260906",
]

# Pytest is the supported runner; shared legacy fixtures also import tests/ helpers.
[tool.pytest.ini_options]
pythonpath = [".", "tests"]
addopts = "--cov --cov-report=term-missing -q"
testpaths = ["tests"]


[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]

[tool.ruff]
line-length = 100
extend-exclude = ["analysis/archive"]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  N: pep8-naming  UP: pyupgrade  D: pydocstyle
select = ["E", "W", "F", "I", "N", "UP", "D"]
# N812/N817: noisy for common aliases (pd/np)
# D105/D107: magic methods and __init__ don't need docstrings
# D203/D213: incompatible with Google style (use D211/D212 instead)
ignore = ["N812", "N817", "D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# Allow common single-letter loop vars and domain abbreviations
ignore-names = ["i", "j", "k", "e", "ex", "df"]

[tool.mypy]
# Resolve installed dependencies/stubs from the locked project environment even
# when Trunk launches mypy from its separate tool runtime.
python_executable = ".venv/bin/python"
# Trunk runs files concurrently in isolated sandboxes; shared incremental state
# can contain cross references to another sandbox and crash mypy.
incremental = false
python_version = "3.12"
disallow_untyped_defs = true
# All maintained modules, including lazy runtime imports and verification tools.
files = ["."]
exclude = '(^|/)(tests|analysis)/|(^|/)build_board_deck[.]py$'
explicit_package_bases = true

[tool.ruff.lint.per-file-ignores]
# Existing unittest method naming/docs are separate from maintained production policy.
"tests/**" = ["D", "N802"]
# Frozen historical slide code is source-checked and formatted; API docs/types are
# outside the maintained application scope. Its aggregate snapshot is tested.
"build_board_deck.py" = ["D103"]

# These installed rendering/Arrow libraries do not ship typing metadata. Boundaries
# remain typed in our adapters; ignore only missing external implementation stubs.
[[tool.mypy.overrides]]
module = ["plotly.*", "pyarrow.*", "pygwalker.*", "st_aggrid.*"]
ignore_missing_imports = true
